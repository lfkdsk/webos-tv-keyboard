<!DOCTYPE html>
<!-- Desktop preview of the TV screen: python3 -m http.server 8767 (repo root) → /scripts/tv-preview.html -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}iframe{border:0;width:1920px;height:1080px}</style>
<iframe id="f" src="../app/index.html"></iframe>
<script src="../service/qrcode.js"></script>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    var w = f.contentWindow, url = 'http://10.0.0.61:7788/?t=Xy12abCDefGH';
    var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    var svg = qr.createSvgTag({cellSize: 8, margin: 2, scalable: true});
    w.PalmServiceBridge = function () {};
    w.PalmServiceBridge.prototype.cancel = function () {};
    w.PalmServiceBridge.prototype.call = function () { var self = this; setTimeout(function () { self.onservicecallback(JSON.stringify({returnValue: true, listening: true, url: url, qr: svg, pairing: 'ready'})); }, 50); };
    w.location.reload = function () {};
    var s = w.document.createElement('script'); s.src = 'app.js'; w.document.body.appendChild(s);
  });
</script>
